name: Test Azure Login - Managed Identity Auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with managed identity auth type (expect failure - no managed identity available)
        id: login
        uses: .
        continue-on-error: true
        with:
          auth-type: IDENTITY
          subscription-id: 'fake-subscription-id-00000000-0000-0000-0000-000000000000'

      - name: Assert action ran and failed gracefully (no managed identity available)
        env:
          OUTCOME: ${{ steps.login.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no managed identity available in test environment)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (managed identity may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
