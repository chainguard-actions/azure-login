name: Test Azure Login - Service Principal (no creds, graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action fails gracefully with missing credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: 'fake-client-id'
          tenant-id: 'fake-tenant-id'
          subscription-id: 'fake-subscription-id'
          auth-type: 'SERVICE_PRINCIPAL'
          environment: 'azurecloud'

      - name: Assert action failed gracefully (no real Azure credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Azure credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (real credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
