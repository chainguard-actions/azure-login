name: Test Azure Login - Creds JSON Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test login with creds JSON format (expect graceful failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          creds: '{"clientId":"fake-client-id","clientSecret":"fake-secret","subscriptionId":"fake-sub-id","tenantId":"fake-tenant-id"}'
          auth-type: 'SERVICE_PRINCIPAL'
          environment: 'azurecloud'

      - name: Assert action failed gracefully (no real Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake credentials rejected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real credentials were available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
