name: Test Azure Login - JSON creds input (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action with JSON creds input fails gracefully
        id: action
        uses: .
        continue-on-error: true
        with:
          creds: '{"clientId":"fake-client-id","clientSecret":"fake-secret","subscriptionId":"fake-subscription-id","tenantId":"fake-tenant-id"}'
          environment: 'azurecloud'
          enable-AzPSSession: false

      - name: Assert action failed gracefully (fake JSON creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake JSON credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (real credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
