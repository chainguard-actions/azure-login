name: Test Azure Login - allow-no-subscriptions flag (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action with allow-no-subscriptions enabled fails gracefully
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: 'fake-client-id'
          tenant-id: 'fake-tenant-id'
          auth-type: 'SERVICE_PRINCIPAL'
          allow-no-subscriptions: true
          environment: 'azurecloud'

      - name: Assert action failed gracefully (no real Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake credentials, no subscriptions path)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (real credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
