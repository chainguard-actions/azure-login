name: Test creds JSON auth input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: login
        uses: .
        continue-on-error: true
        with:
          creds: '{"clientId":"fake-client-id","clientSecret":"fake-secret","subscriptionId":"fake-subscription-id","tenantId":"fake-tenant-id"}'
          environment: 'azurecloud'
      - name: Assert action ran and failed gracefully with invalid creds JSON
        env:
          OUTCOME: ${{ steps.login.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid creds"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
