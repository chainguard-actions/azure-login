name: Test Azure Login - Service Principal
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test service principal login with fake creds (expect graceful failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: 'fake-client-id-00000000-0000-0000-0000-000000000000'
          tenant-id: 'fake-tenant-id-00000000-0000-0000-0000-000000000000'
          subscription-id: 'fake-subscription-id-00000000-0000-0000-0000-000000000000'
          auth-type: 'SERVICE_PRINCIPAL'
          environment: 'azurecloud'

      - name: Assert action failed gracefully (no real Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Azure credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real credentials were available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
